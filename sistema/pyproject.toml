[project]
name = "sistema-exoma"
version = "0.1.0"
description = "Sistema web del laboratorio central para el circuito del exoma clínico (TTPS 2026, grupo 10)"
authors = [
    {name = "TTPS 2026 – grupo 10"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "flask-sqlalchemy-lite (>=0.2.1,<0.3.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "flask-session (>=0.8.0,<0.9.0)",
    "cachelib (>=0.17.2,<0.18.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "flask-mail (>=0.10.0,<0.11.0)",
    "apscheduler (>=3.11.3,<4.0.0)",
    "xhtml2pdf (>=0.2.28,<0.3.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "supabase (>=2.34.1,<3.0.0)",
    "flask-wtf (>=1.3.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.4,<0.18.0)"
]
