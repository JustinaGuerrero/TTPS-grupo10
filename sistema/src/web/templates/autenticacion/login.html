{% extends "layout.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Iniciar sesión</h1>
          <p class="text-body-secondary small mb-4">Ingresá con tu mail y tu contraseña.</p>

          <form method="post" action="{{ url_for('autenticacion.iniciar_sesion') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if siguiente %}
              <input type="hidden" name="next" value="{{ siguiente }}">
            {% endif %}
            <div class="mb-3">
              <label for="email" class="form-label">Mail</label>
              <input type="email" class="form-control" id="email" name="email"
                     value="{{ email or '' }}" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
              <label for="contrasena" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="contrasena" name="contrasena"
                     autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
