{% extends "layout.html" %}
{% block title %}Verificar ingreso{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Verificar ingreso</h1>
          <p class="text-body-secondary small mb-4">
            Ingresá el código de seis dígitos que enviamos a tu mail. Vence en 10 minutos.
          </p>

          {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
          {% endif %}

          <form method="post" action="{{ url_for('autenticacion.verificar_codigo') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
              <label for="codigo" class="form-label">Código de verificación</label>
              <input type="text" class="form-control" id="codigo" name="codigo"
                     inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
                     minlength="6" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Confirmar código</button>
          </form>

          <form method="post" action="{{ url_for('autenticacion.reenviar_codigo') }}" class="mt-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-link w-100">Reenviar código</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
