{% extends "layout.html" %}

{% block title %}Pagar estudio{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Pagar estudio</h1>

  <div class="card shadow-sm" style="max-width: 32rem;">
    <div class="card-body">
      <p class="mb-1">Estudio {{ estudio.codigo }}</p>
      <p class="h4" id="importe-final">{{ importe_final }} USD</p>
      <p class="small text-body-secondary">
        Pago único, sin cuotas. Por ahora el pago es simulado: no se cobra nada real.
      </p>
      <form method="post" action="{{ url_for('pagos.confirmar_pago', estudio_id=estudio.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="importe" value="{{ importe_final }}">
        <button type="submit" class="btn btn-primary">Confirmar pago de {{ importe_final }} USD</button>
        <a class="btn btn-link" href="{{ url_for('pagos.presupuesto', estudio_id=estudio.id) }}">Volver</a>
      </form>
    </div>
  </div>
{% endblock %}
